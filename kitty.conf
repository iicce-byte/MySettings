font_family      DejaVuSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18
disable_ligatures always

shell_integration no-cursor
cursor_shape block

repaint_delay 30
input_delay 5
sync_to_monitor yes
cursor_blink_interval 0
background_opacity 1.0
background_blur 0
hide_window_decorations titlebar-only
enable_audio_bell no
visual_bell_duration 0

remember_window_size  yes
initial_window_width  900
initial_window_height 600

scrollback_lines 3000

background            #000000
foreground            #ddddee
selection_background  #223848
selection_foreground  #ddddee
cursor                #ffff00
cursor_text_color     #000000
# URL 下划线配色
url_color             #3f90f0
# ANSI 16 色标准色盘 (映射自 ef-deuteranopia-dark 调色板)[cite: 1]
# Black (bg-dim / border)[cite: 1]
color0  #121f34
color8  #555a64
# Red (red / red-warmer)[cite: 1]
color1  #cf8560
color9  #e47360
# Green (green / green-cooler)[cite: 1]
color2  #3faa26
color10 #3fa672
# Yellow (yellow / yellow-warmer)[cite: 1]
color3  #aa9f32
color11 #cfaf00
# Blue (blue / blue-warmer)[cite: 1]
color4  #3f90f0
color12 #6a9fff
# Magenta (magenta / magenta-warmer)[cite: 1]
color5  #b379bf
color13 #af80ea
# Cyan (cyan / cyan-cooler)[cite: 1]
color6  #5faaef
color14 #0db0ff
# White (fg-dim / fg-main)[cite: 1]
color7  #7f8797
color15 #ddddee

# 5. 常用快捷键 (macOS 风格)
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

map cmd+plus       change_font_size all +1.0
map cmd+minus      change_font_size all -1.0
map cmd+0          change_font_size all 0
map cmd+shift+r    load_config_file
